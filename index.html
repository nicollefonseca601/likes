<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação com Likes</title>
    <!-- Conecta o arquivo CSS -->
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <main class="cartao">
        <h1>Avalie o conteúdo</h1>
        <p> Clique em um dos joinhas: </p>
        <!-- Área com os cinco likes -->
        <div class="area-likes">
            <button class="like" data-valor="1"> &#128077; </button>
            <button class="like" data-valor="2"> &#128077; </button>
            <button class="like" data-valor="3"> &#128077; </button>
            <button class="like" data-valor="4"> &#128077; </button>
            <button class="like" data-valor="5"> &#128077; </button>
        </div>
        <!-- Apresenta a quantidade selecionada -->
        <p class="resultado"> Likes: <span id="contador">0</span> </p>
    </main>
    <!-- Conecta o arquivo JavaScript -->
    <script src="script.js"></script>
</body>


</html>
